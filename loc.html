<!DOCTYPE html>
<html>
  <head>
    <title>Show Location with Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = L.map('map').setView([11.8904449, 75.4102511], 13); // example: New Delhi

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      L.marker([11.8904449, 75.4102511]).addTo(map)
        .bindPopup('Destination!')
        .openPopup();
    </script>
  </body>
</html>
