<html>
<head>
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        .profile-container {
            width: 60%;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .profile-container p {
            font-size: 16px;
            line-height: 1.5;
        }
        .profile-container p strong {
            color: #555;
        }
        .profile-container img {
        display: block;
        margin: 10px auto; /* Center the image horizontally */
        border: 1px solid #ddd;
        border-radius: 4px;
        height: 100px;
        width: auto;}
        .profile-container a {
            display: inline-block;


            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }

        .profile-container a button {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #6785FF;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    </style>
</head>
<body>

<h1>User Profile</h1>
<div class="profile-container">
    <p><a href="{{ user.profile_image }}" target="_blank"><img src="{{ user.profile_image }}" alt="Profile Image" /></a></p>
    <p><strong>First Name:</strong> {{ user.first_name }}</p>
    <p><strong>Last Name:</strong> {{ user.last_name }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Phone Number:</strong> {{ user.phone_number }}</p>
    <p><strong>House:</strong> {{ user.house }}</p>
    <p><strong>District:</strong> {{ user.district }}</p>
    <p><strong>Place:</strong> {{ user.place }}</p>
    <p><strong>Post:</strong> {{ user.post }}</p>
    <p><strong>Pin:</strong> {{ user.pin }}</p>
    <!-- <p><strong>Latitude:</strong> {{ user.latitude }}</p> -->
    <p><a href="{{ user.license_image }}" target="_blank"><button>View licens</button></a></p>
    
    

    <a href="{% url 'profile_update' %}"><button>UPDATE</button></a>
</div>

</body>
</html>
