{% extends 'logistics_home.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black text-white uppercase tracking-tight">Edit Profile</h1>
            <p class="text-white/40 text-sm mt-1">Update your personal information.</p>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-black border border-white/10 p-8">
        {% csrf_token %}

        <h3 class="text-xs font-bold uppercase tracking-widest text-white/40 mb-6 border-b border-white/10 pb-4">
            Personal Information</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- First Name -->
            <div class="space-y-2">
                <label for="first_name" class="block text-[10px] font-bold uppercase tracking-wider text-white/60">First
                    Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- Last Name -->
            <div class="space-y-2">
                <label for="last_name" class="block text-[10px] font-bold uppercase tracking-wider text-white/60">Last
                    Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- Phone Number -->
            <div class="space-y-2">
                <label for="phone_number"
                    class="block text-[10px] font-bold uppercase tracking-wider text-white/60">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number" value="{{ user.phone_number }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- Profile Image -->
            <div class="space-y-2">
                <label for="profile_image"
                    class="block text-[10px] font-bold uppercase tracking-wider text-white/60">Profile Image</label>
                <input type="file" id="profile_image" name="profile_image"
                    class="w-full bg-white/5 border border-white/10 text-white text-xs file:mr-4 file:py-2 file:px-4 file:border-0 file:text-[10px] file:font-bold file:uppercase file:tracking-widest file:bg-white file:text-black hover:file:bg-white/90">
                {% if user.profile_image %}
                <p class="text-[10px] text-white/40 mt-1">Current: {{ user.profile_image.name }}</p>
                {% endif %}
            </div>
        </div>

        <h3 class="text-xs font-bold uppercase tracking-widest text-white/40 mb-6 border-b border-white/10 pb-4">Address
            Information</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- House -->
            <div class="space-y-2">
                <label for="house" class="block text-[10px] font-bold uppercase tracking-wider text-white/60">House
                    Name</label>
                <input type="text" id="house" name="house" value="{{ user.house }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- Place -->
            <div class="space-y-2">
                <label for="place"
                    class="block text-[10px] font-bold uppercase tracking-wider text-white/60">Place</label>
                <input type="text" id="place" name="place" value="{{ user.place }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- District -->
            <div class="space-y-2">
                <label for="district"
                    class="block text-[10px] font-bold uppercase tracking-wider text-white/60">District</label>
                <input type="text" id="district" name="district" value="{{ user.district }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- Post -->
            <div class="space-y-2">
                <label for="post" class="block text-[10px] font-bold uppercase tracking-wider text-white/60">Post
                    Office</label>
                <input type="text" id="post" name="post" value="{{ user.post }}" required
                    class="w-full bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>

            <!-- PIN -->
            <div class="space-y-2 md:col-span-2">
                <label for="pin" class="block text-[10px] font-bold uppercase tracking-wider text-white/60">PIN
                    Code</label>
                <input type="text" id="pin" name="pin" value="{{ user.pin }}" required
                    class="w-full md:w-1/2 bg-white/5 border border-white/10 text-white text-sm focus:ring-0 focus:border-white/30 px-4 py-3 placeholder-white/20">
            </div>
        </div>

        <div class="pt-6 border-t border-white/10 flex items-center justify-end gap-4">
            <a href="{% url 'profile_view' %}"
                class="px-6 py-3 border border-white/20 text-white text-xs font-bold uppercase tracking-widest hover:bg-white/5 transition-colors">
                Cancel
            </a>
            <button type="submit"
                class="px-8 py-3 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-white/90 transition-colors">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
