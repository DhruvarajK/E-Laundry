<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6c8bae;
            --text-color: #333;
            --light-bg: #f8f9fa;
            --border-color: #dee2e6;
            --success-color: #28a745;
            --input-focus: #e8f0fe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--primary-color);
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.2);
            background-color: var(--input-focus);
        }

        input[type="file"] {
            padding: 8px;
            background-color: var(--light-bg);
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
            grid-column: span 2;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
            background-color: var(--light-bg);
            border-radius: 5px;
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .file-label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .current-image {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: span 1;
            }

            .container {
                padding: 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Update Profile</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-grid">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required placeholder="Enter your first name">
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" required placeholder="Enter your last name">
                </div>

                <div class="form-group full-width">
                    <label for="profile_image">Profile Image</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="profile_image" name="profile_image">
                    </div>
                    {% if user.profile_image %}
                    <div class="current-image">Current: {{ user.profile_image.name }}</div>
                    {% endif %}
                </div>

                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="text" id="phone_number" name="phone_number" value="{{ user.phone_number }}" required placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="house">House</label>
                    <input type="text" id="house" name="house" value="{{ user.house }}" required placeholder="Enter your house name">
                </div>

                <div class="form-group">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" value="{{ user.district }}" required placeholder="Enter your district">
                </div>

                <div class="form-group">
                    <label for="place">Place</label>
                    <input type="text" id="place" name="place" value="{{ user.place }}" required placeholder="Enter your place">
                </div>

                <div class="form-group">
                    <label for="post">Post</label>
                    <input type="text" id="post" name="post" value="{{ user.post }}" required placeholder="Enter your post office name">
                </div>

                <div class="form-group">
                    <label for="pin">PIN Code</label>
                    <input type="text" id="pin" name="pin" value="{{ user.pin }}" required placeholder="Enter your PIN code">
                </div>

                <div class="btn-container">
                    <button type="submit">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
