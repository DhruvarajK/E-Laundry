<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>QR Code Scanner</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4cc9f0;
      --danger-color: #ef233c;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --border-radius: 12px;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: var(--dark-color);
      line-height: 1.6;
      padding: 20px;
      max-width: 100vw;
      overflow-x: hidden;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .card {
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 25px;
      margin-bottom: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      color: var(--primary-color);
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark-color);
    }
    
    select, input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    select:focus, input:focus {
      border-color: var(--accent-color);
      outline: none;
      box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.25);
    }
    
    .btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
    }
    
    .btn:hover {
      background-color: var(--secondary-color);
      transform: translateY(-2px);
    }
    
    .btn-danger {
      background-color: var(--danger-color);
    }
    
    .btn-danger:hover {
      background-color: #d90429;
    }
    
    .btn-scanner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    #cameraModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }
    
    video {
      width: 90%;
      max-width: 500px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
    }
    
    .scanner-container {
      position: relative;
      width: 90%;
      max-width: 500px;
    }
    
    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid var(--accent-color);
      border-radius: var(--border-radius);
      pointer-events: none;
    }
    
    .scanner-corners {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--accent-color);
      border-style: solid;
      border-width: 0;
    }
    
    .top-left {
      top: 20px;
      left: 20px;
      border-top-width: 4px;
      border-left-width: 4px;
    }
    
    .top-right {
      top: 20px;
      right: 20px;
      border-top-width: 4px;
      border-right-width: 4px;
    }
    
    .bottom-left {
      bottom: 20px;
      left: 20px;
      border-bottom-width: 4px;
      border-left-width: 4px;
    }
    
    .bottom-right {
      bottom: 20px;
      right: 20px;
      border-bottom-width: 4px;
      border-right-width: 4px;
    }
    
    .scanner-line {
      position: absolute;
      height: 2px;
      width: 80%;
      background-color: var(--accent-color);
      top: 50%;
      left: 10%;
      animation: scanline 2s linear infinite;
    }
    
    @keyframes scanline {
      0% {
        top: 20%;
      }
      50% {
        top: 80%;
      }
      100% {
        top: 20%;
      }
    }
    
    .modal-actions {
      display: flex;
      justify-content: center;
      width: 90%;
      max-width: 500px;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }
      
      .card {
        padding: 20px;
      }
      
      .header h1 {
        font-size: 24px;
      }
    }
    
    .success-animation {
      animation: successFlash 0.5s;
    }
    
    @keyframes successFlash {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(76, 201, 240, 0.3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>QR Code Scanner</h1>
      <p>Scan and assign bags to service orders</p>
    </div>
    
    <div class="card">
      <form id="qrForm" method="POST" action="{% url 'check_assign_bags' service_order_id %}">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="service_type">Service Type:</label>
          <select name="service_type" required>
            <option value="hand wash">Hand Wash</option>
            <option value="machine wash">Machine Wash</option>
            <option value="dry clean">Dry Clean</option>
              <option value="Ironing">Ironing</option>
          </select>
        </div>
        <div class="form-group">
          <label for="qr_code">Preferences</label>
          <input type="text" id="prefer" name="prefer" placeholder="Type your preferences">
        </div>
        
        
        <div class="form-group">
          <label for="qr_code">Bag QR Code:</label>
          <input type="text" id="qr_code" name="qr_code" readonly placeholder="Scan QR code to populate">
        </div>
        
        <button type="submit" class="btn">Assign Bag</button>
      </form>
      
      <button onclick="openCamera()" class="btn btn-scanner">
        <i class="fas fa-qrcode"></i> Scan QR Code
      </button>
    </div>
  </div>

  <div id="cameraModal" style="display: none;">
    <div class="scanner-container">
      <video id="video" autoplay></video>
      <div class="scanner-overlay">
        <div class="scanner-corners top-left"></div>
        <div class="scanner-corners top-right"></div>
        <div class="scanner-corners bottom-left"></div>
        <div class="scanner-corners bottom-right"></div>
        <div class="scanner-line"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeCamera()">
        <i class="fas fa-times"></i> Cancel
      </button>
    </div>
  </div>

  <script>
    // Closes the camera and stops the video stream
    function closeCamera() {
      const cameraModal = document.getElementById('cameraModal');
      const video = document.getElementById('video');
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      cameraModal.style.display = 'none';
    }
  
    // Opens the camera, scans for a QR code, and fills the input field
    function openCamera() {
      const video = document.getElementById('video');
      const cameraModal = document.getElementById('cameraModal');
      let qrDetected = false;
      cameraModal.style.display = 'flex';
  
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
      })
      .then(stream => {
        video.srcObject = stream;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
  
        video.addEventListener('playing', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
  
          const scanQRCode = () => {
            if (!qrDetected && video.srcObject) {
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              detector.detect(canvas)
                .then(barcodes => {
                  if (barcodes.length > 0) {
                    qrDetected = true;
                    const qrCodeValue = barcodes[0].rawValue;
  
                    // Set the scanned value into the input field
                    document.getElementById('qr_code').value = qrCodeValue;
                    
                    // Show success animation
                    const scannerContainer = document.querySelector('.scanner-container');
                    scannerContainer.classList.add('success-animation');
                    
                    // Wait a moment before closing to show success animation
                    setTimeout(() => {
                      // Stop the camera stream
                      stream.getTracks().forEach(track => track.stop());
                      cameraModal.style.display = 'none';
                      
                      // Remove animation class
                      scannerContainer.classList.remove('success-animation');
                    }, 500);
                  } else {
                    setTimeout(scanQRCode, 700);
                  }
                })
                .catch(err => {
                  console.error('Barcode detection error:', err);
                  setTimeout(scanQRCode, 700);
                });
            }
          };
          scanQRCode();
        });
      })
      .catch(err => {
        console.error('Error accessing camera:', err);
        alert('Unable to access camera. Check permissions.');
        cameraModal.style.display = 'none';
      });
    }
  </script>
