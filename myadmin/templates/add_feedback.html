<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Scan QR | ELaundry</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ffffff",
            "background-light": "#f6f6f8",
            "background-dark": "#000000",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0px",
            "lg": "0px",
            "xl": "0px",
            "full": "0px"
          },
        },
      },
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-black dark:text-white antialiased min-h-screen flex">

<main class="flex-1 bg-black relative overflow-y-auto">

    <!-- Header -->
    <header
    class="h-16 bg-black border-b border-white/10 flex items-center justify-between px-5 sticky top-0 z-30">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-white text-2xl">waves</span>
        <span class="text-white text-lg font-black uppercase tracking-tight">
        ELaundry
        </span>
    </div>
    </header>

    <!-- Page Container -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
<div class="max-w-2xl mx-auto space-y-8">
    <!-- Header -->
    <div class="text-center md:text-left border-b border-white/10 pb-8">
        <h2 class="text-xs font-bold uppercase tracking-[0.4em] text-white/40 mb-2">Support</h2>
        <h3 class="text-3xl font-black uppercase tracking-tight text-white">Send Feedback</h3>
    </div>

    <div class="border border-white/10 bg-white/5 p-6 md:p-10">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-3">
                <label for="feedbackMessage"
                    class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-white/60">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Your Feedback
                </label>
                <div class="relative">
                    <textarea name="message" id="feedbackMessage" rows="6"
                        class="w-full bg-black/20 border border-white/10 text-white p-4 focus:border-white/40 focus:outline-none transition-colors text-sm"
                        placeholder="Share your thoughts, suggestions, or concerns..." required></textarea>
                </div>
                <p class="text-[10px] text-white/30 flex items-center gap-2">
                    <i data-lucide="info" class="w-3 h-3"></i> Your feedback helps us improve our services.
                </p>
            </div>

            <div class="flex flex-col-reverse md:flex-row gap-4 pt-4 border-t border-white/10">
                <a href="{% url 'feedback_list' %}"
                    class="px-6 py-3 border border-white/20 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-black transition-colors text-center">
                    Cancel
                </a>
                <button type="submit"
                    class="flex-1 px-6 py-3 bg-white text-black text-[10px] font-bold uppercase tracking-widest hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> Send Feedback
                </button>
            </div>
        </form>
    </div>
</div>

</section>
</main>
<script>
    lucide.createIcons();
</script>
</body>
</html>
