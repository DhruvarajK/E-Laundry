<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-black text-zinc-200 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Bill Log Details</h1>
            </div>
            <button onclick="goBack()"
                class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold uppercase tracking-widest rounded transition-colors flex items-center gap-2 border border-white/10">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back
            </button>
        </div>

        <!-- Bill Content -->
        <div class="bg-zinc-900 border border-white/10 rounded-lg shadow-2xl overflow-hidden">
            <div class="bg-zinc-950 px-6 py-4 border-b border-white/10 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-widest text-zinc-500">Raw Bill Output</span>
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/50"></div>
                </div>
            </div>
            <div class="p-0 overflow-x-auto">
                <pre class="p-6 text-sm font-mono text-zinc-300 leading-relaxed whitespace-pre-wrap">{{ bill }}</pre>
            </div>
            <div class="bg-zinc-950/50 px-6 py-4 border-t border-white/10 flex flex-wrap gap-4">
                <button onclick="printBill()"
                    class="px-6 py-2 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-zinc-200 transition-colors rounded flex items-center gap-2">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    Print
                </button>
                <button onclick="downloadBill()"
                    class="px-6 py-2 bg-zinc-800 text-white text-xs font-bold uppercase tracking-widest hover:bg-zinc-700 transition-colors border border-white/10 rounded flex items-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Download PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function goBack() {
            window.history.back();
        }

        function printBill() {
            window.print();
        }

        function downloadBill() {
            // Placeholder: Implement actual PDF download logic here if backend supports it
            alert("PDF download functionality to be implemented.");
        }
    </script>
</body>

</html>
