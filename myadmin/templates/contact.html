{% extends 'main_index.html' %}
{% block title %}
<title>Contact Us</title>
{% endblock %}
{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6 lg:px-20 py-12">
    <div
        class="w-full max-w-2xl border border-white/10 bg-black p-12 md:p-20 relative overflow-hidden group text-center">
        <div
            class="absolute -top-1/2 -right-1/2 w-full h-full bg-white/5 blur-3xl rounded-full pointer-events-none group-hover:bg-white/10 transition-all duration-1000">
        </div>
        <div
            class="absolute -bottom-1/2 -left-1/2 w-full h-full bg-white/5 blur-3xl rounded-full pointer-events-none group-hover:bg-white/10 transition-all duration-1000">
        </div>

        <div class="relative z-10 flex flex-col gap-8 items-center">
            <div class="flex flex-col gap-4">
                <h2 class="text-3xl font-black uppercase tracking-tighter text-white">Contact Us</h2>
                <p class="text-white/40 text-xs font-bold uppercase tracking-widest leading-relaxed">Reach out to the
                    developer or find us on GitHub</p>
            </div>

            <div class="w-24 h-px bg-white/20"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
                <div class="flex flex-col gap-4 text-left p-6 border border-white/5 bg-white/[0.02]">
                    <div class="flex flex-col gap-1">
                        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40">Developer</span>
                        <p class="text-sm font-medium text-white">Dhruvaraj K</p>
                    </div>
                    <div class="flex flex-col gap-1">
                        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40">Email</span>
                        <p class="text-sm font-medium text-white">dhruvarajk52@gmail.com</p>
                    </div>
                </div>

                <a href="https://github.com/DhruvarajK" target="_blank"
                    class="flex flex-col gap-4 text-left p-6 border border-white/10 bg-white/5 hover:bg-white/10 transition-all group/card">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40">GitHub</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-white/60 group-hover/card:text-white transition-colors">
                            <path
                                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                            <path d="M9 18c-4.51 2-5-2-7-2" />
                        </svg>
                    </div>
                    <div class="flex flex-col gap-1">
                        <p class="text-sm font-bold text-white group-hover/card:underline">@DhruvarajK</p>
                        <p class="text-[10px] text-white/40 uppercase tracking-widest font-bold">Follow the development
                        </p>
                    </div>
                </a>
            </div>

            <div class="w-full max-w-xs mt-4">
                <a href="/"
                    class="w-full bg-white text-black py-4 text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-all inline-block rounded-none border border-white">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
