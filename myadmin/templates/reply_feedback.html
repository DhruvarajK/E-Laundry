<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reply to Feedback | ELaundry</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffffff",
                        "background-light": "#f6f6f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                },
            },
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        ::selection {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-black dark:text-white antialiased min-h-screen flex">

    <main class="flex-1 bg-black relative overflow-y-auto">

        <!-- Header -->
        <header class="h-16 bg-black border-b border-white/10 flex items-center justify-between px-5 sticky top-0 z-30">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-white text-2xl">waves</span>
                <span class="text-white text-lg font-black uppercase tracking-tight">
                    ELaundry
                </span>
            </div>
        </header>

        <!-- Page Container -->
        <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

            <!-- Page Title -->
            <div
                class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 border-b border-white/10 pb-6">
                <div>
                    <h2 class="text-[10px] font-bold uppercase tracking-[0.35em] text-white/40 mb-2">
                        Support
                    </h2>
                    <h3 class="text-2xl sm:text-3xl md:text-4xl font-black uppercase tracking-tight">
                        Reply to Feedback
                    </h3>
                </div>

                <a href="{% url 'feedback_list' %}"
                    class="px-6 py-3 border border-white/20 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-black transition flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Back to List
                </a>
            </div>

            <!-- Feedback Details -->
            <div class="space-y-6">
                <div class="border border-white/10 bg-white/5 p-6 md:p-8 space-y-6">
                    <div class="flex items-center gap-4 border-b border-white/5 pb-4">
                        <div class="w-10 h-10 bg-white/10 flex items-center justify-center border border-white/10">
                            <i data-lucide="message-circle" class="w-5 h-5 text-white/50"></i>
                        </div>
                        <div>
                            <span class="text-white font-bold uppercase tracking-wider text-sm block">
                                User Feedback
                            </span>
                            <span class="text-[10px] text-white/40 uppercase tracking-widest block mt-1">
                                Original Message
                            </span>
                        </div>
                    </div>

                    <div class="bg-black/30 p-5 border border-white/5 text-white/80 text-sm leading-relaxed">
                        {{ feedback.message }}
                    </div>

                    <!-- Reply Form -->
                    <form method="post" class="pt-4 space-y-6">
                        {% csrf_token %}

                        <div class="space-y-3">
                            <label for="adminReply"
                                class="text-[10px] font-bold uppercase tracking-widest text-white/60 flex items-center gap-2">
                                <i data-lucide="corner-down-right" class="w-4 h-4 text-white/40"></i>
                                Your Response
                            </label>
                            <textarea name="reply" id="adminReply" rows="6"
                                class="w-full bg-white/5 border border-white/10 focus:border-white/30 focus:ring-0 text-white p-4 text-sm resize-none placeholder:text-white/20"
                                placeholder="Type your reply to this feedback..." required></textarea>
                        </div>

                        <div class="flex justify-end">
                            <button type="submit"
                                class="px-8 py-4 bg-white text-black text-[10px] font-bold uppercase tracking-widest hover:bg-gray-200 transition flex items-center gap-2">
                                <i data-lucide="send" class="w-4 h-4"></i>
                                Send Response
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Info Tip -->
                <div class="p-4 border border-white/5 bg-white/[0.02] flex items-center gap-4">
                    <i data-lucide="info" class="w-4 h-4 text-white/30"></i>
                    <p class="text-[10px] text-white/40 uppercase tracking-widest">
                        Responding promptly to feedback helps improve user satisfaction.
                    </p>
                </div>
            </div>

        </section>

        <script>
            lucide.createIcons();
        </script>
    </main>
</body>

</html>
