<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Subscription Plan</title>
    <style>
        :root {
            --primary: #4A6FDC;
            --primary-color: #6a8ae3;
            --primary-hover: #3a5abe;
            --secondary-color: #f3f4f6;
            --text-color: #1f2937;
            --light-gray: #e5e7eb;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9fafb;
            color: var(--text-color);
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .link:hover {
            text-decoration: underline;
        }

        /* Price input with currency symbol */
        .price-input {
            position: relative;
        }

        .price-input input {
            padding-left: 2rem;
        }

        .price-input::before {
            content: "$";
            position: absolute;
            left: 0.75rem;
            top: 0.75rem;
            color: var(--text-color);
            font-weight: 600;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
                margin: 1rem auto;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create a New Subscription Plan</h1>
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Plan Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Basic, Premium, Pro">
            </div>
            
            <div class="form-group">
                <label for="price">Price</label>
                <div class="price-input">
                    <input type="number" step="0.01" id="price" name="price" required placeholder="0.00">
                </div>
            </div>
            
            <div class="form-group">
                <label for="duration_days">Duration (Days)</label>
                <input type="number" id="duration_days" name="duration_days" required placeholder="e.g. 30, 90, 365">
            </div>
            
            <div class="form-group">
                <label for="max_services">Maximum Services</label>
                <input type="number" id="max_services" name="max_services" required placeholder="e.g. 5, 10, unlimited">
            </div>
            <div class="form-group">
                <label for="max_services">Service Type</label>
                <input type="text" id="service_type" name="service_type" required placeholder="e.g. dry clean,washing">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Describe the features and benefits of this plan"></textarea>
            </div>
            
            <button type="submit" class="btn">Create Plan</button>
        </form>
        <a href="{% url 'list_subscription_plans' %}" class="link">View all subscription plans</a>
    </div>
</body>
</html>
