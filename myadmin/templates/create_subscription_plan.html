{% extends 'admin_home.html' %}
{% block title %}Create Subscription Plan{% endblock %}
{% block body %}
<div class="max-w-2xl mx-auto h-full flex flex-col justify-center">
    <div class="bg-surface border border-white/10 p-8 shadow-2xl">
        <h3 class="text-lg font-bold uppercase tracking-widest text-white mb-8 border-b border-white/10 pb-4">Create New
            Plan</h3>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="name" class="text-xs font-bold uppercase tracking-widest text-white/60">Plan
                        Name</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Premium"
                        class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all">
                </div>

                <div class="space-y-2">
                    <label for="price" class="text-xs font-bold uppercase tracking-widest text-white/60">Price
                        ($)</label>
                    <input type="number" step="0.01" id="price" name="price" required placeholder="0.00"
                        class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all">
                </div>

                <div class="space-y-2">
                    <label for="duration_days"
                        class="text-xs font-bold uppercase tracking-widest text-white/60">Duration (Days)</label>
                    <input type="number" id="duration_days" name="duration_days" required placeholder="e.g. 30"
                        class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all">
                </div>

                <div class="space-y-2">
                    <label for="max_services" class="text-xs font-bold uppercase tracking-widest text-white/60">Max
                        Services</label>
                    <input type="number" id="max_services" name="max_services" required placeholder="e.g. 10"
                        class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all">
                </div>
            </div>

            <div class="space-y-2">
    <label for="service_type" class="text-xs font-bold uppercase tracking-widest text-white/60">
        Service Type
    </label>

    <select id="service_type" name="service_type" required
        class="w-full bg-white/5 border border-white/10 text-white p-4 pr-12
               appearance-none focus:outline-none focus:border-white/40
               transition-colors uppercase tracking-wider text-sm">
        <option value="" disabled selected class="bg-zinc-900 text-white">
            Select a service
        </option>
        <option value="machine-wash" class="bg-zinc-900 text-white">Machine Wash</option>
        <option value="iron" class="bg-zinc-900 text-white">Iron</option>
        <option value="fold" class="bg-zinc-900 text-white">Fold</option>
        <option value="hand-wash" class="bg-zinc-900 text-white">Hand Wash</option>
        <option value="hand-wash-iron" class="bg-zinc-900 text-white">Hand Wash & Ironing</option>
        <option value="machine-wash-iron" class="bg-zinc-900 text-white">  Machine Wash & Ironing </option>
    </select>
</div>

            <div class="space-y-2">
                <label for="description"
                    class="text-xs font-bold uppercase tracking-widest text-white/60">Description</label>
                <textarea id="description" name="description" placeholder="Describe the plan benefits..." rows="4"
                    class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all resize-none"></textarea>
            </div>

            <div class="pt-4 flex items-center justify-between">
                <a href="{% url 'list_subscription_plans' %}"
                    class="text-xs font-bold uppercase tracking-widest text-white/40 hover:text-white transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-8 py-3 bg-white hover:bg-gray-100 text-black text-xs font-bold uppercase tracking-widest transition-colors shadow-lg shadow-blue-900/20">
                    Create Plan
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
