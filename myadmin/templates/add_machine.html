{% extends 'admin_home.html' %}
{% block title %}{% if machine %}Edit Machine{% else %}Add New Machine{% endif %}{% endblock %}
{% block body %}
<div class="max-w-xl mx-auto h-full flex flex-col justify-center">
    <div class="bg-surface border border-white/10 p-8 shadow-2xl">
        <h3 class="text-lg font-bold uppercase tracking-widest text-white mb-8 border-b border-white/10 pb-4">
            {% if machine %}Edit Machine: {{ machine.name }}{% else %}Register New Machine{% endif %}
        </h3>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-2">
                <label for="name" class="text-xs font-bold uppercase tracking-widest text-white/60">Machine Name</label>
                <input type="text" id="name" name="name" value="{{ machine.name }}" required
                    placeholder="e.g. Washer HD-01"
                    class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all">
            </div>

            <div class="space-y-2">
                <label for="capacity" class="text-xs font-bold uppercase tracking-widest text-white/60">Daily Capacity
                    (kg)</label>
                <input type="number" step="0.1" id="capacity" name="capacity" value="{{ machine.capacity }}" required
                    placeholder="e.g. 50.0"
                    class="w-full bg-black/20 border border-white/10 text-white text-sm py-3 px-4 focus:ring-1 focus:ring-white/20 focus:border-white/20 outline-none placeholder-white/20 transition-all">
            </div>

            <div class="flex items-center gap-3">
                <input type="checkbox" id="is_active" name="is_active" {% if not machine or machine.is_active %}checked{% endif %}
                    class="w-4 h-4 bg-black/20 border border-white/10 text-white focus:ring-0 focus:ring-offset-0 transition-all">
                <label for="is_active" class="text-xs font-bold uppercase tracking-widest text-white/60">Mark as
                    Active</label>
            </div>

            <div class="pt-4 flex items-center justify-between">
                <a href="{% url 'manage_machines' %}"
                    class="text-xs font-bold uppercase tracking-widest text-white/40 hover:text-white transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-8 py-3 bg-white hover:bg-gray-100 text-black text-xs font-bold uppercase tracking-widest transition-colors shadow-lg">
                    {% if machine %}Update Machine{% else %}Register Machine{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
