{% extends 'main_index.html' %}
{% block title %}
<title>Login</title>
{% endblock %}
{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6 lg:px-20 py-12">
    <div class="w-full max-w-md border border-white/10 bg-black p-8 md:p-12 relative overflow-hidden group">
        <div
            class="absolute -top-1/2 -right-1/2 w-full h-full bg-white/5 blur-3xl rounded-full pointer-events-none group-hover:bg-white/10 transition-all duration-1000">
        </div>

        <div class="relative z-10 flex flex-col gap-8">
            <div class="flex flex-col gap-2">
                <h2 class="text-3xl font-black uppercase tracking-tighter text-white">Login</h2>
                <p class="text-white/40 text-xs font-bold uppercase tracking-widest leading-relaxed">Access your account
                    dashboard</p>
            </div>

            <form class="flex flex-col gap-6" action="{% url 'login_post' %}" method="post">
                {% csrf_token %}
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40" for="textfield">Email
                        Address</label>
                    <input
                        class="bg-transparent border-b border-white/20 py-2 text-sm text-white font-medium placeholder:text-white/20 focus:border-white focus:outline-none transition-colors rounded-none"
                        name="textfield" id="textfield" type="email" placeholder="ENTER EMAIL ADDRESS">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40"
                        for="textfield2">Password</label>
                    <input
                        class="bg-transparent border-b border-white/20 py-2 text-sm text-white font-medium placeholder:text-white/20 focus:border-white focus:outline-none transition-colors rounded-none"
                        name="textfield2" id="textfield2" type="password" placeholder="ENTER PASSWORD">
                </div>

                <div class="flex flex-col gap-4 mt-4">
                    <button type="submit"
                        class="w-full bg-white text-black py-4 text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-all rounded-none border border-white">
                        Login
                    </button>
                    <!-- Keeping original 'Sign up' button behavior, even if two submits are odd -->
                    <button type="submit"
                        class="w-full border border-white/20 text-white py-4 text-xs font-bold uppercase tracking-widest hover:bg-white/5 transition-all rounded-none">
                        Sign up
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
