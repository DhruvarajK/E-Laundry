{% extends 'user_home.html' %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto text-center py-12">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-500/10 mb-8">
        <span class="material-symbols-outlined text-4xl text-green-500">check_circle</span>
    </div>

    <h2 class="text-3xl font-black uppercase tracking-tight text-white mb-4">Order Successful</h2>
    <p class="text-white/60 max-w-md mx-auto mb-12">Your order has been successfully placed.</p>

    <div class="flex justify-center gap-4">
        <a href="{% url 'normal_order' %}"
            class="px-8 py-4 bg-white text-black font-bold uppercase tracking-widest text-xs hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-sm">add_circle</span>
            Place Another Order
        </a>
        <a href="{% url 'view_all_orders' %}"
            class="px-8 py-4 border border-white/20 text-white font-bold uppercase tracking-widest text-xs hover:bg-white hover:text-black transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-sm">history</span>
            View History
        </a>
    </div>
</div>
{% endblock %}
