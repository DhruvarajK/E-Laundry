<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
</head>
<body>
    <h2>Scan QR Code</h2>
    <video id="preview" autoplay playsinline></video>
    <canvas id="qr-canvas" style="display:none;"></canvas>
    <button onclick="scanQR()">Scan QR Code</button>
    <p id="result"></p>

    <form id="qrForm" method="POST" action="/check-assign-bags/">
        {% csrf_token %}
        <input type="hidden" id="qr_code" name="qr_code">
        <label for="service_type">Service Type:</label>
        <select name="service_type" required>
            <option value="hand wash">Hand Wash</option>
            <option value="machine wash">Machine Wash</option>
            <option value="dry clean">Dry Clean</option>
            <option value="Ironing">Ironing</option>
        </select>
        <button type="submit">Assign Bag</button>
    </form>

    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script>
        const codeReader = new ZXing.BrowserQRCodeReader();
        const videoElement = document.getElementById('preview');

        async function scanQR() {
            try {
                const devices = await codeReader.getVideoInputDevices();
                await codeReader.decodeFromVideoDevice(devices[0].deviceId, videoElement, (result, err) => {
                    if (result) {
                        document.getElementById('result').innerText = "QR Code: " + result.text;
                        document.getElementById('qr_code').value = result.text;
                        codeReader.reset();
                    }
                });
            } catch (error) {
                alert('Error accessing camera: ' + error);
            }
        }
    </script>
</body>
</html>
