{% extends 'user_home.html' %}
{% load static %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
    <div class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-[0.4em] text-white/40">New Service request</h2>
        <h3 class="text-3xl md:text-4xl font-black uppercase tracking-tight text-white">Place Your Order</h3>
    </div>

    {% if messages %}
    <div class="space-y-4">
        {% for message in messages %}
        <div class="p-4 border border-white/10 bg-white/5 text-white text-sm flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info-icon lucide-info"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="border border-white/10 bg-black p-8 md:p-12">
        <form method="POST" class="space-y-8">
            {% csrf_token %}

            <div class="space-y-4">
                <label for="service_type"
                    class="block text-xs font-bold uppercase tracking-widest text-white/60">Service Type</label>
                    <select id="service_type" name="service_type" required
                            class="w-full bg-white/5 border border-white/10 text-white p-4 pr-12
                                    appearance-none focus:outline-none focus:border-white/40
                                    transition-colors uppercase tracking-wider text-sm">

                            <option value="" disabled selected class="bg-zinc-900 text-white">
                                Select a service
                            </option>

                            <option value="dry-clean" class="bg-zinc-900 text-white">Dry Clean</option>
                            <option value="Machine Wash" class="bg-zinc-900 text-white">Machine Wash</option>
                            <option value="iron" class="bg-zinc-900 text-white">Iron</option>
                            <option value="fold" class="bg-zinc-900 text-white">Fold</option>
                            <option value="steam-press" class="bg-zinc-900 text-white">Steam Press</option>
                            <option value="starch" class="bg-zinc-900 text-white">Starch</option>
                            <option value="hand-wash" class="bg-zinc-900 text-white">Hand Wash</option>
                            <option value="spot-cleaning" class="bg-zinc-900 text-white">Spot Cleaning</option>
                            <option value="delicate-care" class="bg-zinc-900 text-white">Delicate Care</option>
                            <option value="Hand wash & Ironing" class="bg-zinc-900 text-white">
                                Hand wash & Ironing
                            </option>
                            <option value="Machine wash & Ironing" class="bg-zinc-900 text-white">
                                Machine wash & Ironing
                            </option>
                            </select>
            </div>

            <div class="space-y-4">
                <label for="special_instructions"
                    class="block text-xs font-bold uppercase tracking-widest text-white/60">Special Instructions</label>
                <textarea id="special_instructions" name="special_instructions" rows="4"
                    placeholder="Add any special instructions or notes for your order here..."
                    class="w-full bg-white/5 border border-white/10 text-white p-4 focus:outline-none focus:border-white/40 transition-colors placeholder:text-white/20 text-sm"></textarea>
            </div>

            <div class="space-y-4">
                <label for="weight"
                    class="block text-xs font-bold uppercase tracking-widest text-white/60">Estimated Weight (kg)</label>
                <input type="number" step="0.1" id="weight" name="weight" required
                    placeholder="Enter estimated weight in kg"
                    class="w-full bg-white/5 border border-white/10 text-white p-4 focus:outline-none focus:border-white/40 transition-colors placeholder:text-white/20 text-sm">
            </div>

            <div class="pt-4">
                <button type="submit"
                    class="w-full bg-white text-black font-semibold uppercase tracking-widest py-4 hover:bg-gray-200 transition-colors flex items-center justify-center gap-3">
                    <span>Confirm Order</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
