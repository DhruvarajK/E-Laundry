{% extends 'user_home.html' %}
{% load static %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
    <div class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-[0.4em] text-white/40">New Service request</h2>
        <h3 class="text-3xl md:text-4xl font-black uppercase tracking-tight text-white">Place Your Order</h3>
    </div>

    {% if messages %}
    <div class="space-y-4">
        {% for message in messages %}
        <div class="p-4 border border-white/10 bg-white/5 text-white text-sm flex items-center gap-3">
            <span class="material-symbols-outlined text-green-400">check_circle</span>
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="border border-white/10 bg-black p-8 md:p-12">
        <form method="POST" class="space-y-8">
            {% csrf_token %}

            <div class="space-y-4">
                <label for="service_type"
                    class="block text-xs font-bold uppercase tracking-widest text-white/60">Service Type</label>
                <div class="relative">
                    <select id="service_type" name="service_type" required
                        class="w-full bg-white/5 border border-white/10 text-white p-4 pr-12 appearance-none focus:outline-none focus:border-white/40 transition-colors uppercase tracking-wider text-sm">
                        <option value="" disabled selected>Select a service</option>
                        <option value="dry-clean">Dry Clean</option>
                        <option value="Machine Wash">Machine Wash</option>
                        <option value="iron">Iron</option>
                        <option value="fold">Fold</option>
                        <option value="steam-press">Steam Press</option>
                        <option value="starch">Starch</option>
                        <option value="hand-wash">Hand Wash</option>
                        <option value="spot-cleaning">Spot Cleaning</option>
                        <option value="delicate-care">Delicate Care</option>
                        <option value="Hand wash & Ironing">Hand wash & Ironing</option>
                        <option value="Machine wash & Ironing">Machine wash & Ironing</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-white/40">
                        <span class="material-symbols-outlined">expand_more</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <label for="special_instructions"
                    class="block text-xs font-bold uppercase tracking-widest text-white/60">Special Instructions</label>
                <textarea id="special_instructions" name="special_instructions" rows="4"
                    placeholder="Add any special instructions or notes for your order here..."
                    class="w-full bg-white/5 border border-white/10 text-white p-4 focus:outline-none focus:border-white/40 transition-colors placeholder:text-white/20 text-sm"></textarea>
            </div>

            <div class="pt-4">
                <button type="submit"
                    class="w-full bg-white text-black font-black uppercase tracking-widest py-4 hover:bg-gray-200 transition-colors flex items-center justify-center gap-3">
                    <span>Confirm Order</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
