<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to {{ plan.name }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffffff",
                        "background-light": "#f6f6f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-black text-white antialiased min-h-screen p-6 lg:p-12 font-display flex items-center justify-center">

    <div class="max-w-xl w-full mx-auto py-12">
        <div class="border border-white/10 bg-black p-8 relative overflow-hidden">
            <div class="flex flex-col items-center text-center">
                <h2 class="text-xs font-bold uppercase tracking-[0.4em] text-white/40 mb-2">Checkout</h2>
                <h3 class="text-2xl font-black uppercase tracking-tight text-white mb-6">Subscribe to {{ plan.name }}
                </h3>

                <div
                    class="inline-block px-6 py-2 border border-white/20 bg-white/5 text-2xl font-black text-white mb-8">
                    ₹{{ plan.price }}
                </div>

                <div class="w-full bg-white/5 border-l-2 border-white p-6 text-left mb-8">
                    <p class="text-white/80 text-sm leading-relaxed italic">
                        "{{ plan.description }}"
                    </p>
                </div>

                {% if not active_subscription %}
                <div class="w-full">
                    <form method="post" action="{% url 'subscribe' plan.id %}" class="w-full">
                        {% csrf_token %}
                        <button type="submit"
                            class="w-full py-4 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
                            Proceed to Payment
                            <span class="material-symbols-outlined text-lg">arrow_forward</span>
                        </button>
                    </form>
                    <p class="text-[10px] text-white/20 uppercase tracking-widest mt-4">Secure Payment Gateway</p>
                </div>
                {% else %}
                <div
                    class="w-full p-4 border border-red-500/30 bg-red-500/10 text-red-400 text-sm font-bold text-center">
                    <div class="flex items-center justify-center gap-2 mb-1">
                        <span class="material-symbols-outlined">warning</span>
                        <span>Active Subscription Found</span>
                    </div>
                    <p class="text-xs text-red-400/60 font-normal">Please wait until your current subscription expires.
                    </p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>

</html>
