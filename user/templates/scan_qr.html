<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Scan QR | ELaundry</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ffffff",
            "background-light": "#f6f6f8",
            "background-dark": "#000000",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0px",
            "lg": "0px",
            "xl": "0px",
            "full": "0px"
          },
        },
      },
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-black dark:text-white antialiased min-h-screen flex">


  <main class="flex-1 bg-black relative overflow-y-auto">
    <header class=" h-16 bg-black border-b border-white/10 flex items-center justify-between px-5 sticky top-0 z-30">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-white text-2xl">waves</span>
        <span class="text-white text-lg font-black uppercase tracking-tight">
          ELaundry
        </span>
      </div>
    </header>

    <!-- Content -->
    <section
      class="px-6 py-10 sm:py-16 max-w-4xl mx-auto flex flex-col items-center justify-center min-h-[calc(100vh-4rem)] space-y-10">

      <div class="text-center space-y-3">
        <h2 class="text-[10px] font-bold uppercase tracking-[0.35em] text-white/40">
          Bag Identification
        </h2>
        <h3 class="text-2xl sm:text-4xl md:text-5xl font-black uppercase tracking-tight">
          Scan Laundry Bag
        </h3>
        <p class="text-white/60 text-sm max-w-md mx-auto">
          Position the QR code within the scanner frame to view details.
        </p>
      </div>

      <!-- Scan Button -->
      <button onclick="openCamera()"
        class="group flex flex-col items-center justify-center gap-4
               w-56 h-56 sm:w-64 sm:h-64
               border border-white/20 bg-white/5
               hover:bg-white/10 hover:border-white/40
               transition-all rounded-full">
        <span
          class="material-symbols-outlined text-6xl text-white group-hover:scale-110 transition-transform">
          qr_code_scanner
        </span>
        <span class="text-xs font-bold uppercase tracking-widest">
          Open Scanner
        </span>
      </button>

    </section>

    <!-- Camera Modal -->
    <div id="cameraModal"
      class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden items-center justify-center">

      <div class="w-full max-w-2xl px-4 flex flex-col items-center gap-6">
        <div
          class="w-full aspect-video bg-black border border-white/20 relative overflow-hidden rounded-lg">
          <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>

          <!-- Frame -->
          <div class="absolute inset-0 border border-white/10 pointer-events-none"></div>

          <!-- Scanner box -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-56 h-56 sm:w-64 sm:h-64 border-2 border-dashed border-white/50 relative">
              <div class="absolute top-0 left-0 w-full h-0.5 bg-white/80 animate-[scan_2s_infinite]"></div>
            </div>
          </div>
        </div>

        <div id="scanStatus"
          class="text-center text-white/60 text-sm font-mono h-6">
          Scanning for QR Code...
        </div>

        <div class="flex gap-3 flex-wrap justify-center">
          <button id="switchCamera" style="display: none;"
            class="px-5 py-2.5 border border-white/20 text-white text-xs font-bold uppercase tracking-widest hover:bg-white hover:text-black transition flex items-center gap-2">
            <span class="material-symbols-outlined text-base">cameraswitch</span>
            Switch
          </button>

          <button onclick="closeCamera()"
            class="px-6 py-2.5 border border-red-500 text-red-500 text-xs font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition flex items-center gap-2">
            <span class="material-symbols-outlined text-base">close</span>
            Close
          </button>
        </div>
      </div>
    </div>

  </main>

  <style>
    @keyframes scan {
      0% {
        top: 0;
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        top: 100%;
        opacity: 0;
      }
    }
  </style>

  <script>
    // Check if device has multiple cameras
    navigator.mediaDevices.enumerateDevices()
      .then(devices => {
        const videoInputs = devices.filter(device => device.kind === 'videoinput');
        if (videoInputs.length > 1) {
          document.getElementById('switchCamera').style.display = 'flex';
        }
      });

    let facingMode = 'environment';
    let currentStream = null;

    // Switch between front and back cameras
    document.getElementById('switchCamera').addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      closeCamera();
      setTimeout(openCamera, 300); // Slight delay to ensure closing finishes
    });

    // Closes the camera and stops the video stream
    function closeCamera() {
      const cameraModal = document.getElementById('cameraModal');
      const video = document.getElementById('video');
      const scanStatus = document.getElementById('scanStatus');

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      cameraModal.classList.add('hidden');
      cameraModal.classList.remove('flex');
      scanStatus.textContent = 'Scanning for QR Code...';
      scanStatus.classList.remove('text-green-400', 'text-red-400');
      scanStatus.classList.add('text-white/60');

      setTimeout(() => {
        video.srcObject = null;
      }, 300);
    }

    // Opens the camera, scans for a QR code, and redirects to the bag details page
    function openCamera() {
      const video = document.getElementById('video');
      const cameraModal = document.getElementById('cameraModal');
      const scanStatus = document.getElementById('scanStatus');
      let qrDetected = false;

      cameraModal.classList.remove('hidden');
      cameraModal.classList.add('flex');

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      })
        .then(stream => {
          currentStream = stream;
          video.srcObject = stream;

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // Re-check for BarcodeDetector support
          if ('BarcodeDetector' in window) {
            const detector = new BarcodeDetector({ formats: ['qr_code'] });

            video.addEventListener('playing', () => {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;

              const scanQRCode = () => {
                if (!qrDetected && video.srcObject) {
                  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                  detector.detect(canvas)
                    .then(barcodes => {
                      if (barcodes.length > 0) {
                        qrDetected = true;
                        const qrCode = barcodes[0].rawValue;
                        scanStatus.textContent = 'QR Code found! Redirecting...';
                        scanStatus.classList.remove('text-white/60', 'text-red-400');
                        scanStatus.classList.add('text-green-400');

                        // Redirect to bag details page with the scanned QR code
                        setTimeout(() => {
                          window.location.href = `/bag-details/?qr_code=${encodeURIComponent(qrCode)}`;
                        }, 800);
                      } else {
                        setTimeout(scanQRCode, 200);
                      }
                    })
                    .catch(err => {
                      console.error('Barcode detection error:', err);
                      // Only show error status occasionally or in logs to avoid flickering
                      // scanStatus.textContent = 'Error detecting barcode.'; 
                      if (!qrDetected) setTimeout(scanQRCode, 200);
                    });
                }
              };
              scanQRCode();
            });
          } else {
            scanStatus.textContent = 'QR scanner not supported on this browser';
            scanStatus.classList.remove('text-white/60');
            scanStatus.classList.add('text-red-400');
          }
        })
        .catch(err => {
          console.error('Error accessing camera:', err);
          scanStatus.textContent = 'Unable to access camera. Check permissions.';
          scanStatus.classList.remove('text-white/60');
          scanStatus.classList.add('text-red-400');
        });
    }

    // Close modal when clicking Escape key
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeCamera();
      }
    });
  </script>
</body>

</html>
