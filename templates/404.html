{% extends 'main_index.html' %}
{% block title %}
<title>404 - Page Not Found</title>
{% endblock %}
{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6 lg:px-20 py-12">
    <div
        class="w-full max-w-2xl border border-white/10 bg-black p-12 md:p-20 relative overflow-hidden group text-center">
        <div
            class="absolute -top-1/2 -right-1/2 w-full h-full bg-white/5 blur-3xl rounded-full pointer-events-none group-hover:bg-white/10 transition-all duration-1000">
        </div>
        <div
            class="absolute -bottom-1/2 -left-1/2 w-full h-full bg-white/5 blur-3xl rounded-full pointer-events-none group-hover:bg-white/10 transition-all duration-1000">
        </div>

        <div class="relative z-10 flex flex-col gap-8 items-center">
            <div class="flex flex-col gap-4">
                <h1 class="text-8xl md:text-9xl font-black uppercase tracking-tighter text-white opacity-20">404</h1>
                <div class="flex flex-col gap-2 -mt-12 md:-mt-16">
                    <h2 class="text-3xl font-black uppercase tracking-tighter text-white">Lost in the fold</h2>
                    <p class="text-white/40 text-xs font-bold uppercase tracking-widest leading-relaxed">The page you're
                        looking for was either misplaced or never existed.</p>
                </div>
            </div>

            <div class="w-24 h-px bg-white/20"></div>

            <div class="flex flex-col gap-4 w-full max-w-xs">
                <a href="/"
                    class="w-full bg-white text-black py-4 text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-all rounded-none border border-white">
                    Back to Home
                </a>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/20">Need help? <a href="/contact"
                        class="text-white hover:underline">Contact Support</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
