{% extends 'business_home.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
        <div>
            <h2 class="text-3xl font-black uppercase tracking-tight text-white mb-2">Update Profile</h2>
            <p class="text-white/60 text-sm">Update your business details and contact information.</p>
        </div>
    </div>

    <div class="border border-white/10 bg-black p-8">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Business Name -->
                <div class="space-y-2">
                    <label for="business_name"
                        class="block text-xs font-bold uppercase tracking-widest text-white/60">Business Name</label>
                    <input type="text" id="business_name" name="business_name" value="{{ user.business_name }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="Enter business name" required>
                </div>

                <!-- Owner Name -->
                <div class="space-y-2">
                    <label for="owner_name"
                        class="block text-xs font-bold uppercase tracking-widest text-white/60">Owner Name</label>
                    <input type="text" id="owner_name" name="owner_name" value="{{ user.owner_name }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="Enter owner name" required>
                </div>

                <!-- Phone Number -->
                <div class="space-y-2">
                    <label for="business_phone_number"
                        class="block text-xs font-bold uppercase tracking-widest text-white/60">Phone Number</label>
                    <input type="text" id="business_phone_number" name="business_phone_number"
                        value="{{ user.business_phone_number }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="Enter phone number">
                </div>
                <!-- Address -->
                <div class="md:col-span-2 space-y-2">
                    <label for="business_address"
                        class="block text-xs font-bold uppercase tracking-widest text-white/60">Address</label>
                    <textarea id="business_address" name="business_address" rows="3"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="Enter full address">{{ user.business_address }}</textarea>
                </div>

                <!-- District -->
                <div class="space-y-2">
                    <label for="district"
                        class="block text-xs font-bold uppercase tracking-widest text-white/60">District</label>
                    <input type="text" id="district" name="district" value="{{ user.district }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="District">
                </div>

                <!-- Place -->
                <div class="space-y-2">
                    <label for="place"
                        class="block text-xs font-bold uppercase tracking-widest text-white/60">Place</label>
                    <input type="text" id="place" name="place" value="{{ user.place }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="Place">
                </div>

                <!-- Post -->
                <div class="space-y-2">
                    <label for="post" class="block text-xs font-bold uppercase tracking-widest text-white/60">Post
                        Office</label>
                    <input type="text" id="post" name="post" value="{{ user.post }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="Post Office">
                </div>

                <!-- PIN -->
                <div class="space-y-2">
                    <label for="pin" class="block text-xs font-bold uppercase tracking-widest text-white/60">PIN
                        Code</label>
                    <input type="text" id="pin" name="pin" value="{{ user.pin }}"
                        class="w-full bg-white/5 border border-white/10 text-white placeholder-white/20 px-4 py-3 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-colors"
                        placeholder="PIN Code">
                </div>
            </div>

            <div class="flex justify-end gap-4 pt-6 border-t border-white/10">
                <a href="{% url 'view_profile_business' %}"
                    class="px-6 py-3 border border-white/20 text-white text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-6 py-3 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
